
<!doctype html>
    <html lang="en">
        <body>
            <Script>
            
    // ---- DEV TEST PANEL (remove before production) ----
  (function() {
    const TEST_OLED_INCALL = {
      state: 'tunneling', connected_flag: 1,
      rssi: 18, ip: '192.168.1.42', tcp_port: '1234',
      apn: 'internet.sim', sim: 'SIM1', mode: 1,
      meter_reading_state: 1, meter_baudrate: '9600',
      meter_port: 0, meter_config: 0,
      fw_version: '4.3.0', hw_version: '1.0', build_date: '2026-05-22'
    };
    const TEST_OLED_WAITING = {
      state: 'waiting_for_client', connected_flag: 0,
      rssi: 18, ip: '192.168.1.42', tcp_port: '1234',
      apn: 'internet.sim', sim: 'SIM1', mode: 1,
      meter_reading_state: 1, meter_baudrate: '9600',
      meter_port: 0, meter_config: 0,
      fw_version: '4.3.0', hw_version: '1.0', build_date: '2026-05-22'
    };

    function applyCallState(inCall) {
      const overlay    = document.getElementById('inCallOverlay');
      const oledWidget = document.getElementById('oledWidget');
      const oledFrame  = oledWidget ? oledWidget.querySelector('.oled-frame') : null;
      if (overlay)    overlay.style.display = inCall ? 'block' : 'none';
      if (oledWidget) oledWidget.classList.toggle('oled-widget--incall', inCall);
      if (oledFrame)  oledFrame.classList.toggle('oled-frame--incall', inCall);
      let badge = document.getElementById('oledInCallBadge');
      if (inCall) {
        window.updateOLED(TEST_OLED_INCALL);
        if (!badge) {
          badge = document.createElement('div');
          badge.id = 'oledInCallBadge';
          badge.className = 'oled-incall-badge';
          badge.innerHTML = '<span class="oled-blink">&#9679;</span><span>Call in progress — configuration blocked</span>';
          oledWidget.appendChild(badge);
        }
      } else {
        window.updateOLED(TEST_OLED_WAITING);
        if (badge) badge.remove();
      }
    }

    // Inject panel HTML
    const panel = document.createElement('div');
    panel.id = 'devTestPanel';
    panel.style.cssText = 'position:fixed;bottom:16px;right:16px;z-index:99999;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,.4);font-family:monospace;font-size:12px;color:#94a3b8;min-width:180px;';
    panel.innerHTML = `
      <div style="font-size:10px;letter-spacing:.1em;color:#64748b;text-transform:uppercase;border-bottom:1px solid #334155;padding-bottom:6px;margin-bottom:2px;">&#9881; Dev Panel</div>
      <button id="devBtnInCall"   style="background:#16a34a;color:#fff;border:none;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:11px;font-weight:600;">&#9679; Simular llamada</button>
      <button id="devBtnNoCall"   style="background:#475569;color:#fff;border:none;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:11px;font-weight:600;">&#9633; Sin llamada</button>
      <div style="border-top:1px solid #334155;padding-top:6px;font-size:10px;color:#475569;">Estado OLED:</div>
      <select id="devOledState" style="background:#0f172a;color:#94a3b8;border:1px solid #334155;border-radius:5px;padding:4px 6px;font-size:11px;">
        <option value="waiting_for_client">Wait for call</option>
        <option value="tunneling_connected">Call in progress</option>
        <option value="boot">Boot</option>
        <option value="ok_sim">SIM OK</option>
        <option value="no_sim">No SIM</option>
        <option value="close_socket">Call ended</option>
        <option value="maintenance_mode">Maintenance</option>
      </select>
      <button id="devBtnApplyOled" style="background:#2666af;color:#fff;border:none;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:11px;font-weight:600;">Aplicar estado OLED</button>
    `;
    document.body.appendChild(panel);

    document.getElementById('devBtnInCall').onclick  = () => applyCallState(true);
    document.getElementById('devBtnNoCall').onclick  = () => applyCallState(false);
    document.getElementById('devBtnApplyOled').onclick = () => {
      const sel = document.getElementById('devOledState').value;
      const base = { rssi:18, ip:'192.168.1.42', tcp_port:'1234', apn:'internet.sim', sim:'SIM1', mode:1, meter_reading_state:1, meter_baudrate:'9600', meter_port:0, meter_config:0, fw_version:'4.3.0', hw_version:'1.0', build_date:'2026-05-22' };
      if (sel === 'tunneling_connected') window.updateOLED({...base, state:'tunneling', connected_flag:1});
      else if (sel === 'waiting_for_client') window.updateOLED({...base, state:'waiting_for_client', connected_flag:0});
      else window.updateOLED({...base, state: sel, connected_flag:0});
    };

    // Seed initial OLED data so it renders on load
    window.updateOLED(TEST_OLED_WAITING);
  })();
  // ---- END DEV TEST PANEL ----

    </script>
  </body>
</html>
