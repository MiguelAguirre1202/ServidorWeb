<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos Medidor</title>
    <style>
        body {
            /* background: #2e2e30; */
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin-top: 20px;
            /* color: #fcfcfc; */

        svg {
            background: #d4d5d6;
            max-width: 800px;
            max-height: 800px;

            min-height: 400px;

        .fasor {stroke-width: 2;}.fasor2 {stroke-width: 2;stroke-dasharray: 10 10;}.label {font-size: 16px;font-weight: bold;}
        .axis {stroke: rgb(255, 255, 255);stroke-width: 1;stroke-dasharray: 10 10;opacity: .8;}

            margin: 0 auto;

            width: 100%;

        th, td {

        tr:nth-child(even) {

        tr:nth-child(odd) {
            background: #18191d;

        td {
            border-bottom: 1px solid #2a2f45;

        .hover\:bg-blue-500:hover{--tw-bg-opacity: 0.8; background-color:rgb(37 99 235 / var(--tw-bg-opacity))}.back_ground_gatria{ background-color: rgb(38, 102, 175); border-radius: 1px; cursor: pointer; width: 400px; margin-bottom: 15px; padding:5px; font-weight: 600; border: none;}.text-white-button {color: #fff !important;}
        .py-1{padding-top:.25rem;padding-bottom:.25rem}.text-sm{font-size:.875rem;line-height:1.25rem}.mt-2{margin-top:.5rem}.mt-12{margin-top:3rem}
        .estyle_gatria{font-weight:bold; color: rgb(38, 102, 175); font-size: small;}.flex{display:flex}.flex-col{flex-direction:column}.justify-center{justify-content:center}.gap-4{gap:1rem}.mt-6{margin-top:1.5rem}

        .focus-brand{
            display:flex;

            justify-content: center;

        }
        .focus-cloud{
            width: 120px;
            height: auto;
        }
        .focus-word{
            margin:0;
            color:#2666af;

        }
        .focus-box{
            border: 3px solid #2666af;
            padding:8px 14px 10px;
            color: #2666af;

        .focus-box-main{
            font-size: 64px;
            font-weight: 700;
        }
        .focus-box-sub{
            font-size: 28px;

        }
    </style>
</head>

<body>
    <div class="focus-brand">
        <img id="logoImg" 
               class="focus-cloud" 
               alt="Logo Gatria">
        <h1 class="focus-word">F O C U S</h1>

        <div class="focus-box">
            <div class="focus-box-main">IoT</div>
            <div class="focus-box-sub">by Gatria</div>
        </div>
    </div>
    <p class="estyle_gatria">Focus IoT by Gatria es un marca de Gatria SAS</p>
    <h2 class="mt-12" style="font-weight:bold">NMC Lite Modem <p id="hw_version"></p></h1>
    <p id="fw_version" class="text-center text-xs mb-1" style="font-weight:bold"></p>

    <form id="formConfigModem" method="post" action = "/configModem">
        <div class="flex flex-row justify-between items-center gap-4">
            <label>Baud rate Meter:</label>
            <select id="select_baud_meter" name="baud_meter">
                <option value="1200">1200</option>
                <option value="2400">2400</option>
                <option value="4800">4800</option>
                <option value="9600" selected>9600</option>
                <option value="19200">19200</option>
                <option value="38400">38400</option>
            </select>
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label >Meter Configuration:</label>
            <select id="select_serial_meter" name="serial_meter">
                <option value="0">8 N 1</option>
                <option value="1">7 E 1</option>
            </select>
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label>Altern APN:</label>
            <input type="text" id="input_alter_apn" name="alter_apn" maxlength="128" class="reglasInputs">
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label>Other Altern APN:</label>
            <input type="text" id="input_other_altern_apn" name="other_altern_apn" maxlength="128" class="reglasInputs">
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label>APN:</label>
            <input type="text"id="input_apn" name="apn" maxlength="128" class="reglasInputs">
        </div> 
        <div class="flex flex-row justify-between items-center gap-4">
            <label>Altern Operator:</label>
            <input type="number" id="input_altern_opr" name="altern_opr" class="limite" data-max="48">
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label>Other Altern Operator:</label>
            <input type="number" id ="input_other_alter_opr" name="other_alter_opr" class="limite" data-max="48">
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label>Operator:</label>
            <input type="number" id="input_operator" name="operator" class="limite" data-max="48">
        </div>
        <!-- <div class="flex flex-row justify-between items-center gap-4">
            <label>User:</label>
            <input type="text" placeholder="User">
        </div> 
        <div class="flex flex-row justify-between items-center gap-4">
            <label>Password:</label>
            <input type="password" placeholder="Enter your password">
        </div> -->
        <div class="flex flex-row justify-between items-center gap-4">
            <label>Ping Server:</label>
            <input type="text" id="input_ping_server" name="ping_server">
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label>Enable Auth:</label>
            <select id="input_enable_auth" name="enable_auth" class="block appearance-none py-1 px-2 text-sm text-gray-900 border border-gray-200 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                <option value="1">Enable</option>
                <option value="0">Disable</option>
            </select>
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label>Enable Forced 3G:</label>
            <select id="input_enable_forced_3g" name="enable_forced_3g" class="block appearance-none py-1 px-2 text-sm text-gray-900 border border-gray-200 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                <option value="1">Enable</option>
                <option value="0">Disable</option> 
            </select>
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label>Enable Automatic APN:</label>
            <select id="input_enable_automatic_apn" name="enable_automatic_apn" class="block appearance-none py-1 px-2 text-sm text-gray-900 border border-gray-200 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                <option value="1">APN Automatic</option>
                <option value="0">APN Manual</option>
                <option value="2">APN Automatic for operator</option>
            </select>
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label>Enable Transparent Mode:</label>
            <select id="input_enable_transparent_mode" name="enable_transparent_mode" class="block appearance-none py-1 px-2 text-sm text-gray-900 border border-gray-200 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                <option value="1">Enable</option>
                <option value="0">Disable</option>
            </select>
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label>Enable test mode:</label>
            <select id="input_enable_test_mode" name="enable_test_mode" class="block appearance-none py-1 px-2 text-sm text-gray-900 border border-gray-200 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                <option value="1">Enable</option>
                <option value="0">Disable</option>
            </select>
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label>Mode Data:</label>
            <select id="input_mode_data" name="mode_data" class="block appearance-none py-1 px-2 text-sm text-gray-900 border border-gray-200 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                <option value="1">Data Transparent</option>
                <option value="0">Normal mode</option>
            </select>
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label>Enable WD1:</label>
            <select id="input_enable_wd1" name="enable_wd1" class="block appearance-none py-1 px-2 text-sm text-gray-900 border border-gray-200 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                <option value="1">Enable</option>
                <option value="0">Disable</option>
            </select>
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label>Enable WD2:</label>
            <select id="input_enable_wd2" name="enable_wd2" class="block appearance-none py-1 px-2 text-sm text-gray-900 border border-gray-200 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                <option value="1">Enable</option>
                <option value="0">Disable</option>
            </select>
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label>Enable WD3:</label>
            <select id="input_enable_wd3" name="enable_wd3" class="block appearance-none py-1 px-2 text-sm text-gray-900 border border-gray-200 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                <option value="1">Enable</option>
                <option value="0">Disable</option>
            </select>
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label>Enable IN1:</label>
            <select id="input_enable_in1" name="enable_in1" class="block appearance-none py-1 px-2 text-sm text-gray-900 border border-gray-200 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                <option value="1">Enable</option>
                <option value="0">Disable</option>
            </select>
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label>Enable IN2:</label>
            <select id="input_enable_in2" name="enable_in2" class="block appearance-none py-1 px-2 text-sm text-gray-900 border border-gray-200 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                <option value="1">Enable</option>
                <option value="0">Disable</option>
            </select>
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label>Meter type of port selection:</label>
            <select id="input_meter_type_port" name="meter_type_port" class="block appearance-none py-1 px-2 text-sm text-gray-900 border border-gray-200 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                <option value="1">RS485</option>
                <option value="0">RS232</option>
            </select>
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label>TCP Port:</label>
            <input type="number" id="input_tcp_port" name="tcp_port" class="validar-rango" min="1" max="65535">
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label>TCP Maintenance Port:</label>
            <input type="number" id="input_tcp_maintance_port" name="tcp_maintance_port" class="validar-rango" min="1" max="60000">
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label>TCP Timeout ( ms ):</label>
            <input type="number" id="input_tcp_timeout" name="tcp_timeout" class="validar-rango" min="1" max="60000">
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label>Socket Timeout ( ms ):</label>
            <input type="number" id="input_socket_timeout" name="socket_timeout" class="validar-rango" min="1" max="60000">
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label>Time to wait meter response completed ( ms ):</label>
            <input type="number" id="input_time_wait_response" name="time_wait_response" class="validar-rango" min="1" max="254">
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label>Time to Trigger WD1 ( minutes ):</label>
            <input type="number" id="input_time_trigger_wd1" name="time_trigger_wd1" class="validar-rango" min="1" max="254">
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label>Time to Trigger WD2 ( hours ):</label>
            <input type="number" id="input_time_trigger_wd2" name="time_trigger_wd2"  class="validar-rango" min="1" max="254">
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label>Time to Trigger WD3 ( minutes ):</label>
            <input type="number" id="input_time_trigger_wd3" name="time_trigger_wd3"  class="validar-rango" min="1" max="254">
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label>Serial Number:</label>
            <input type="text" id="input_serial_number" name="serial_number">
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label>Key:</label>
            <input type="number" id="input_key" name ="key" min="1" max="9999999" step="1">
        </div>
        <button type="submit" id="btnSave" disabled="false">SAVE</button>
        
        <input type="file" id="configFile" accept=".json" hidden>
        <button type="button" id="btnImport">Importar configuracion</button>
        <button id="btnExport" type="button">Exportar configuracion</button> 
        <button>Configuracion por defecto</button>  
        <button id="btnReset">RESET</button> 
        <button id="btnVolver">Volver</button>

    <script>
        const formulario = document.getElementById('formConfigModem');
        const btnSave    = document.getElementById('btnSave');
        const btnVolver  = document.getElementById('btnVolver');
        const btnReset   = document.getElementById('btnReset');
        const btnExport  = document.getElementById('btnExport');

        const btnImport  = document.getElementById('btnImport');
        const configFile = document.getElementById('configFile');

        async function checkAuth() {
            try{
                const r = await fetch('/auth-check', { method:'GET', cache:'no-store'});
                if(!r.ok){
                    window.location.replace('/update');
                }
            }catch (e){
                window.location.replace('/update');
            } 
        }

        window.addEventListener('pageshow', async (e) =>{
            if(e.persisted){
                await checkAuth();
                return;
            }
            await checkAuth();
        });

        window.addEventListener('pagehide',() =>{
            navigator.sendBeacon('/auth-logout');
        });

        document.querySelectorAll('.reglasInputs').forEach(input =>{
            input.addEventListener('keydown', function(event){
                if(event.keyCode === 32){
                    event.preventDefault();
                }
            });
            input.addEventListener('input', function() {
                this.value = this.value.replace(/\s/g, '');
            });

        });

        document.querySelectorAll('.limite').forEach(input =>{

            input.addEventListener('input', function(){

                const limite =this.getAttribute('data-max');

                if(limite && this.value.length > limite){
                    this.value = this.value.slice(0,limite);
                }

            });
        });

        window.addEventListener('beforeunload', (e) => {
            if (!btnSave.disabled) {
                e.preventDefault();
                e.returnValue = '';
            }
        });
        btnVolver.addEventListener('click', (e) => {
        if (!btnSave.disabled) {
            const confirmar = confirm("Tiene cambios sin guardar. Esta seguro de que quiere salir?");
            if (confirmar) {
                btnSave.disabled = true;
                fetch('/auth-logout',{method: 'POST', cache: 'no-store'})
                    .finally(() => window.location.replace('/update'));
            }
        }else {

            fetch('/auth-logout',{method: 'POST', cache: 'no-store'})
                .finally(() => window.location.replace('/update'));
        }
        });

        btnReset.addEventListener('click', async() => {
        if (!btnSave.disabled) {
            const confirmar = confirm("Tiene cambios sin guardar que se perderan al reiniciar. Desea reiniciar de todos modos?");
            if (!confirmar) return 
        }else if (!confirm('Esta seguro de que quiere reiniciar el dispositivo?')) return;
        try{
            btnReset.disabled = true;
            btnReset.innerText = "Reiniciando...";
        
            const response = await fetch('/reboot', { method: 'POST' });
        
            if (response.ok) {
                alert("Dispositivo reiniciando... la conexion se perdera momentaneamente.");
                setTimeout(() => { window.location.reload(); }, 5000);
            }

        }catch (error){
            console.error("Error al solicitar reinicio:", error);
            btnReset.disabled = false;
            btnReset.innerText = "RESET";
        }
        });
        document.querySelectorAll('.validar-rango').forEach(input => {
            input.addEventListener('input', function() {
                let valor = parseInt(this.value);
                let minimo = parseInt(this.getAttribute('min'));
                let maximo = parseInt(this.getAttribute('max'));
                if (valor > maximo) this.value = maximo;
                if (this.value !== "" && valor < minimo) this.value = minimo;
            });
        });

        const inputKey = document.getElementById('input_key');
        if (inputKey) {
            inputKey.addEventListener('input', function() {
                this.value = this.value.replace(/\D/g, '').slice(0, 7);
            });
        }
        formulario.addEventListener('submit', async(e) =>{

            e.preventDefault();

            const originalText = btnSave.innerText;
            btnSave.innerText = "Saving...";
            btnSave.disabled = true;
            
            const datosFormulario = new URLSearchParams(new FormData(formulario)); 

            try{
                const response = await  fetch('/configModem', {
                    method:'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: datosFormulario
                });

                if(response.ok){
                    btnSave.innerText = "Saved!";
                    setTimeout(() =>{ btnSave.innerText = originalText}, 2000);
                } else {
                    alert("Error al guardar")
                    btnSave.disabled = false;
                    btnSave.innerText = originalText;
                }
            } catch(error){
                console.error("Error de conexión:", error);
                btnSave.disabled=false;
                btnSave = originalText;
            }

        });

        formulario.addEventListener('input', () => {
            btnSave.disabled = false;
            btnSave.style.backgroundColor = "#4CAF50"; 

        });

        window.addEventListener('DOMContentLoaded', async () =>{
            try{
                const respuesta = await fetch('/getConfig');
                const datos = await respuesta.json();

                document.getElementById("select_baud_meter").value = datos.baud_meter;
                document.getElementById("select_serial_meter").value = datos.serial_meter;
                document.getElementById ("input_alter_apn").value = datos.alter_apn;
                document.getElementById ("input_other_altern_apn").value = datos.other_altern_apn;
                document.getElementById ("input_apn").value = datos.apn;
                document.getElementById ("input_altern_opr").value = datos.altern_opr;
                document.getElementById ("input_other_alter_opr").value = datos.other_alter_opr;
                document.getElementById ("input_operator").value = datos.operator;
                document.getElementById ("input_enable_auth").value = datos.enable_auth;
                document.getElementById ("input_enable_forced_3g").value = datos.enable_forced_3g;
                document.getElementById ("input_enable_automatic_apn").value = datos.enable_automatic_apn;
                document.getElementById ("input_enable_transparent_mode").value = datos.enable_transparent_mode;
                document.getElementById ("input_enable_test_mode").value = datos.enable_test_mode;
                document.getElementById ("input_mode_data").value = datos.mode_data;
                document.getElementById ("input_enable_wd1").value = datos.enable_wd1;
                document.getElementById ("input_enable_wd2").value = datos.enable_wd2;
                document.getElementById ("input_enable_wd3").value = datos.enable_wd3;
                document.getElementById ("input_enable_in1").value = datos.enable_in1;
                document.getElementById ("input_enable_in2").value = datos.enable_in2;
                document.getElementById ("input_meter_type_port").value = datos.meter_type_port;
                document.getElementById ("input_tcp_port").value = datos.tcp_port;
                document.getElementById ("input_tcp_maintance_port").value = datos.tcp_maintance_port;
                document.getElementById ("input_tcp_timeout").value = datos.tcp_timeout;
                document.getElementById ("input_socket_timeout").value = datos.socket_timeout;
                document.getElementById ("input_time_wait_response").value = datos.time_wait_response;
                document.getElementById ("input_time_trigger_wd1").value = datos.time_trigger_wd1;
                document.getElementById ("input_time_trigger_wd2").value = datos.time_trigger_wd2;
                document.getElementById ("input_time_trigger_wd3").value = datos.time_trigger_wd3;

                document.getElementById ("input_serial_number").value = datos.serial_number;
                document.getElementById ("input_key").value = datos.key;
                document.getElementById ("input_ping_server").value = datos.ping_server;

                
                console.log("Datos cargados correctamente");
            }catch (error){
                console.error("Error cargando configuracion", error);
            }
        });

        function collectFormConfig(formEl){
            const out = {};
            const controls = formEl.querySelectorAll('input, select, textarea');

            controls.forEach((el) =>{
                if(!el.name || el.type === 'file') return;
                if((el.type === 'checkbox' || el.type === 'radio')) {
                    out[el.name] = el.checked ? (el.value || true): false;
                    return;
                }
                out[el.name] = el.type === 'number' && el.value !== ''? Number(el.value): el.value;
            });

            out.exported_at = new Date().toISOString();
            out.version = 1;
            return out;
        }

        function applyConfigToForm(formEl, cfg){
            Object.entries(cfg).forEach(([key, rawValue]) =>{
                if(key === 'exported_at' || key === 'version') return;
                const field = formEl.elements.namedItem(key);
                if(!field) return;

                const value = rawValue ?? '';
                if(field.type === 'checkbox'){
                    field.checked = value === true || value === 1 || value === '1';
                }else {
                    field.value = String(value);
                }

                field.dispatchEvent(new Event('input',  { bubbles:true }));
                field.dispatchEvent(new Event('change',  { bubbles:true }));
            });

        }

        btnExport.addEventListener('click', () => {
            const data = collectFormConfig(formulario);
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `focuslite_config_${new Date().toISOString().replace(/[:.]/g, '-')}.json`;
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        });
        
        btnImport.addEventListener('click',() => configFile.click());
        configFile.addEventListener('change', async (e) =>{
            const file = e.target.files?.[0];
            if(!file) return;
            try{
                const text = await file.text();
                const cfg = JSON.parse(text);
                applyConfigToForm(formulario, cfg);
                alert('Configuracion importada al formulario. Falta presionar SAVE');
            }catch{
                alert('Archivo JSON invalido');
            }finally {
                configFile.value = '';
            }
