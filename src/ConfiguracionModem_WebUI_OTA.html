<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos Medidor</title>
    <style>
        :root{
            --brand-600:#2666af;
            --brand-300:#99b8d6;
            --brand-700:#1f5594;
            --brand-100:#e6eff9;
        }

        body {
            background: linear-gradient(180deg, var(--brand-100) 0%, #ffffff 40%);
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin-top: 20px;
            color: #0f172a;
        }

        @keyframes espSpin {
            to { transform: rotate(360deg); }
        }

        #espSpinnerOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.22);
            z-index: 10001;
            align-items: center;
            justify-content: center;
        }

        #espSpinnerBox{
            background: #fff;
            border: 1px solid rgba(153,184,214,.95);
            border-radius: 10px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 26px rgba(15, 23, 42, .18);
        }
    
        #espSpinnerBox {
            background: #fff;
            border: 1px solid rgba(153, 184, 214, .95);
            border-radius: 10px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 26px rgba(15, 23, 42, .18);
        }

        #espSpinnerIcon {
            width: 24px;
            height: 24px;
            border: 3px solid #d1d5db;
            border-top-color: var(--brand-600);
            border-radius: 50%;
            animation: espSpin .8s linear infinite;
        }

        #espSpinnerLabel{
            font-size: 13px;
            font-weight: 600;
            color: #0f172a;
        }

        .btn-primary{
            background: var(--brand-600);
            color : #fff;
            border: 1px solid var(--brand-600);
            border-radius: 6px;
            padding: 8px 16px;
            font-weight: 600;
            letter-spacing: .2px;
            box-shadow: 0 2px 6px #2666af40;
            transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.03s ease;
        }

        .btn-primary:hover{
            background: var(--brand-700);
            box-shadow: 0 4px 10px #2666af47;
        }

        .btn-primary:active{
            transform: translateY(1px);
        }

        .btn-primary:focus-visible{
            outline: 2px solid var(--brand-300);
            outline-offset: 2px;
        }

        .btn-primary:disabled,
        .btn-primary[disabled]{
            background: var(--brand-300);
            border-color: var(--brand-300);
            color: #fff;
            opacity: .65;
            box-shadow: none;
            cursor: not-allowed;
            filter: saturate(.8);
        }

        #formConfigModem {
            max-width: 900px;
            margin: 24px auto 60px;
            padding: 24px 22px;
            background: #fff;
            border: 1px solid #99b8d699;
            border-radius: 0 8px 24px rgba(38, 102, 175, .12);
            display: grid;
            gap: 10px;
        }

        /* Filas del formulario */
        #formConfigModem > div {
            display: grid;
            grid-template-columns: 1.1fr 1.1fr;
            gap:12px;
            align-items: center;
            padding: 10px 12px;
            border: 1px solid rgba(153, 184, 214, .6);
            border-radius: 10px;
            background: #f7fbff;
        }
        #formConfigModem > div:nth-child(even) {
            background: #eef4fb;
        }

        #formConfigModem label {
            font-weight: 600;
            color: #2b4b6e;
            /* text-align: left; */
        }

        #formConfigModem input,
        #formConfigModem select{
            width: 100%;
            padding: 8px 10px;
            border: 1px solid rgba(153,184,214,.9);
            border-radius: 8px;
            background: #fff;
            color: #0f172a;
        }

        #formConfigModem input{
            width: 95%;
        }
        

        #formConfigModem input:focus,
        #formConfigModem select:focus{
            outline: none;
            border-color: var(--brand-600);
            box-shadow: 0 0 0 3px rgba(38, 102, 175, .2);
        }

        #formConfigModem > button.btn-primary {
            width: min(100%, 380px);
            margin: 8px auto 0;
            display: block;
        }

        @media (max-width: 740px) {
            #formConfigModem{
                padding: 16px;
            }
            #formConfigModem > div {
                grid-template-columns: 1fr;
            }
        }
        
        svg {
            background: #d4d5d6;
            max-width: 800px;
            max-height: 800px;
            min-width: 400px;
            min-height: 400px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #000;
        }
        .fasor {stroke-width: 2;}.fasor2 {stroke-width: 2;stroke-dasharray: 10 10;}.label {font-size: 16px;font-weight: bold;}
        .axis {stroke: rgb(255, 255, 255);stroke-width: 1;stroke-dasharray: 10 10;opacity: .8;}
        table {
            margin: 0 auto;
            border-collapse: collapse;
            width: 100%;
            max-width: 800px;
            /* color: #f5f5f5; */
            background: #2e2e30;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #ccc;
        }
        
        th, td {
            padding: 12px 8px;
            background-color:#d4d5d6;
        }
        
        th {
            background: #2666afc4;
            color: #ffffff;
            border-bottom: 1px solid #333a55;
        }
        
        tr:nth-child(even) {
            background: #18191d;
        }
        
        tr:nth-child(odd) {
            background: #18191d;
        }
        
        td {
            border-bottom: 1px solid #2a2f45;
        }
        
        .hover\:bg-blue-500:hover{--tw-bg-opacity: 0.8; background-color:rgb(37 99 235 / var(--tw-bg-opacity))}.back_ground_gatria{ background-color: rgb(38, 102, 175); border-radius: 1px; cursor: pointer; width: 400px; margin-bottom: 15px; padding:5px; font-weight: 600; border: none;}.text-white-button {color: #fff !important;}
        .py-1{padding-top:.25rem;padding-bottom:.25rem}.text-sm{font-size:.875rem;line-height:1.25rem}.mt-2{margin-top:.5rem}.mt-12{margin-top:3rem}
        .estyle_gatria{font-weight:bold; color: rgb(38, 102, 175); font-size: small;}.flex{display:flex}.flex-col{flex-direction:column}.justify-center{justify-content:center}.gap-4{gap:1rem}.mt-6{margin-top:1.5rem}
        .button_container{display:flex; flex-direction:column;justify-content:center; align-items:center;}.mt-12{margin-top:3rem}
        .focus-brand{
            display:flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .focus-cloud{
            width: 120px;
            height: auto;
        }
        .focus-word{
            margin:0;
            color:#2666af;
            font-size: 52px;
            font-weight: 100;
            letter-spacing: 0.1em;
        }
        .focus-box{
            border: 3px solid #2666af;
            padding:8px 14px 10px;
            color: #2666af;
            line-height: 1;
        }
        .focus-box-main{
            font-size: 64px;
            font-weight: 700;
        }
        .focus-box-sub{
            font-size: 28px;
            font-weight: 600;
            margin-top: 6px;
        }

        .form-actions{
            background: none !important;
            border: none !important;
        }

        #btnLang {
            position: fixed;
            top: 12px;
            right: 16px;
            background: #fff;
            border: 1.5px solid var(--brand-600);
            border-radius: 20px;
            padding: 5px 14px;
            color: var(--brand-600);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            z-index: 9999;
            letter-spacing: .4px;
            box-shadow: 0 1px 4px rgba(38,102,175,.15);
            transition: background .2s, color .2s;
        }
        #btnLang:hover {
            background: var(--brand-600);
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="focus-brand">
        <img id="logoImg" 
               class="focus-cloud" 
               alt="Logo Gatria">

        <div class="focus-box">

    <form id="formConfigModem" method="post" action = "/configModem">
        <div class="flex flex-row justify-between items-center gap-4">

        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label data-i18n="meter_config">Meter Configuration:</label>
            <select id="select_serial_meter" name="meter_configuration" data-type="number">
                <option value="0">8 N 1</option>
                <option value="1">7 E 1</option>
            </select>
        </div>

        <div class="flex flex-row justify-between items-center gap-4">
            <label data-i18n="automatic_sim">Automatic Select SIM:</label>
            <select id="select_enable_automatic_sim" name="enable_automatic_sim" data-type="number" class="block appearance-none py-1 px-2 text-sm text-gray-900 border border-gray-200 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500">

        <div class="flex flex-row justify-between items-center gap-4">

            </select>
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label data-i18n="altern_apn">Altern APN:</label>
            <input type="text" id="input_alter_apn" name="alter_apn" maxlength="128" class="reglasInputs">
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label data-i18n="other_altern_apn">Other Altern APN:</label>
            <input type="text" id="input_other_alter_apn" name="other_alter_apn" maxlength="128" class="reglasInputs">

        <div class="flex flex-row justify-between items-center gap-4">
            <label data-i18n="apn">APN:</label>
            <input type="text"id="input_apn" name="apn" maxlength="128" class="regla sInputs">
        </div> 
        <div class="flex flex-row justify-between items-center gap-4">
            <label data-i18n="alter_opr">Alter Operator:</label>

        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label data-i18n="operator">Operator:</label>
            <input type="number" id="input_operator" name="operator" class="limite" data-max="48">
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label data-i18n="user">User:</label>
            <input type="text" id="input_user" name="user" maxlength="56" class="reglasInputs">
        </div> 
        <div class="flex flex-row justify-between items-center gap-4">
            <label data-i18n="pass">Password:</label>
            <input type="text" id="input_pass" name="pass" maxlength="56" class="reglasInputs">
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label data-i18n="ping_server">Ping Server:</label>
            <input type="text" id="input_ping_server" name="ping_server">
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label data-i18n="enable_auth">Enable Auth:</label>
            <select id="input_enable_auth" name="enable_auth" data-type="number" class="block appearance-none py-1 px-2 text-sm text-gray-900 border border-gray-200 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                <option value="1">Enable</option>
                <option value="0">Disable</option>
            </select>
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label data-i18n="enable_forced_3g">Enable Forced 3G:</label>
            <select id="input_enable_forced_3g" name="enable_forced_3g" data-type="number" class="block appearance-none py-1 px-2 text-sm text-gray-900 border border-gray-200 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                <option value="1">Enable</option>
                <option value="0">Disable</option> 
            </select>
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label data-i18n="enable_auto_apn">Enable Automatic APN:</label>

                <option value="1">APN Automatic</option>
                <option value="0">APN Manual</option>
                <option value="2">APN Automatic for operator</option>
            </select>
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label data-i18n="enable_transparent">Enable Transparent Mode:</label>
            <select id="input_enable_transparent_mode" name="enable_transparent" data-type="number" class="block appearance-none py-1 px-2 text-sm text-gray-900 border border-gray-200 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                <option value="1">Enable</option>
                <option value="0">Disable</option>
            </select>
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label data-i18n="enable_test_mode">Enable test mode:</label>
            <select id="input_enable_test_mode" name="enable_tmode" data-type="number" class="block appearance-none py-1 px-2 text-sm text-gray-900 border border-gray-200 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                <option value="1">Enable</option>
                <option value="0">Disable</option>
            </select>
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label data-i18n="mode_data">Mode Data:</label>
            <select id="input_mode_data" name="mode" data-type="number" class="block appearance-none py-1 px-2 text-sm text-gray-900 border border-gray-200 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500">

            </select>
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label data-i18n="enable_wd1">Enable WD1:</label>

                <option value="1">Enable</option>

            </select>
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label data-i18n="enable_wd3">Enable WD3:</label>
            <select id="input_enable_wd3" name="enable_wd3" data-type="number" class="block appearance-none py-1 px-2 text-sm text-gray-900 border border-gray-200 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                <option value="1">Enable</option>
                <option value="0">Disable</option>
            </select>
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label data-i18n="enable_in1">Enable IN1:</label>
            <select id="input_enable_in1" name="enable_digital1" data-type="number" class="block appearance-none py-1 px-2 text-sm text-gray-900 border border-gray-200 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                <option value="1">Enable</option>
                <option value="0">Disable</option>
            </select>
        </div>
        <div class="flex flex-row justify-between items-center gap-4">
            <label data-i18n="enable_in2">Enable IN2:</label>
            <select id="input_enable_in2" name="enable_digital2" data-type="number" class="block appearance-none py-1 px-2 text-sm text-gray-900 border border-gray-200 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                <option value="1">Enable</option>
                <option value="0">Disable</option>
            </select>

        <div class="flex flex-row justify-between items-center gap-4">
            <label data-i18n="meter_port">Meter type of port selection:</label>
            <select id="input_meter_type_port" name="meter_port_sel" data-type="number" class="block appearance-none py-1 px-2 text-sm text-gray-900 border border-gray-200 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500">

            <input type="number" id="input_tcp_port" name="tcp_port" class="validar-rango" min="1" max="65535">

            <input type="number" id="input_time_trigger_wd1" name="time_trigger_wd1" class="validar-rango" min="1" max="254">
        </div>
        <div class="flex flex-row justify-between items-center gap-4">

            <input type="number" id="input_time_trigger_wd2" name="time_trigger_wd2"  class="validar-rango" min="1" max="254">

            <input type="text" id="input_serial_number" name="serial_number">

            <label data-i18n="key">Key:</label>
            <input type="text" id="input_key" name ="key" min="0000000" max="9999999" step="1">
        </div>
        <div class="form-actions">
            <input type="file" id="configFile" accept=".json" hidden>
            <button type="button" id="btnImport" class="btn-primary" data-i18n="btn_import">Import configuration</button>
            <button id="btnExport" type="button" class="btn-primary" data-i18n="btn_export">Export configuration</button>

        </div>
        <button type="submit" id="btnSave" class="btn-primary" data-i18n="btn_save" disabled="false">SAVE</button>
    </form>
        
        <button id="btnReset" type="button" class="btn-primary">RESET</button> 
        <button id="btnVolver" type="button" class="btn-primary" data-i18n="btn_back">Back</button>

    <div id="espSpinnerOverlay" aria-live="polite" aria-busy="true">
        <div id="espSpinnerBox">
            <div id="espSpinnerIcon"></div>
            <span id="espSpinnerLabel" data-i18n="spinner_default">Procesando...</span>
        </div>
    </div>
    <script>
        const formulario = document.getElementById('formConfigModem');
        const btnSave    = document.getElementById('btnSave');
        const btnVolver  = document.getElementById('btnVolver');
        const btnReset   = document.getElementById('btnReset');
        const btnExport  = document.getElementById('btnExport');

        const btnImport  = document.getElementById('btnImport');
        const configFile = document.getElementById('configFile');

        const espSpinnerOverlay = document.getElementById('espSpinnerOverlay');
        const espSpinnerLabel   = document.getElementById('espSpinnerLabel');
        let espPendingOps = 0;

        function showEspSpinner(message) {
            espPendingOps++;
            if (espSpinnerLabel) espSpinnerLabel.textContent = message ?? I18N[currentLang].spinner_default;
            if (espSpinnerOverlay) espSpinnerOverlay.style.display = 'flex';
        }
        function hideEspSpinner(){
            espPendingOps = Math.max(0, espPendingOps - 1);
            if(espPendingOps === 0 && espSpinnerOverlay){
                espSpinnerOverlay.style.display = 'none';
                if(espSpinnerLabel) espSpinnerLabel.textContent = I18N[currentLang].spinner_default;
            }
        }

        function getPathFromFetchInput(input){
            const raw = typeof input === 'string'
                ? input
                : (input && input.url ? input.url : '');

            if (!raw) return '';

            try{
                return new URL(raw, window.location.origin).pathname;
            }catch(_){
                return raw;
            }
        }


        function spinnerMessageFor(path){
            if (path === '/auth-check')  return I18N[currentLang].spinner_auth_check;
            if (path === '/getConfig')   return I18N[currentLang].spinner_get_config;

        const CONFIG_KEY_SESSION_STORAGE = 'focuslite.configKey';

        function sanitizeNumericConfigKey(value) {
            return String(value ?? '').replace(/\D/g, '').slice(0, 7);
        }

        function looksLikeSha1(value) {
            return /^[a-f0-9]{40}$/i.test(String(value ?? '').trim());
        }

        function rememberConfigKey(value) {
            const key = sanitizeNumericConfigKey(value);
            try {
                if (key) {
                    sessionStorage.setItem(CONFIG_KEY_SESSION_STORAGE, key);
                } else {
                    sessionStorage.removeItem(CONFIG_KEY_SESSION_STORAGE);
                }
            } catch {}
            return key;
        }

        function getRememberedConfigKey() {
            try {
                return sanitizeNumericConfigKey(sessionStorage.getItem(CONFIG_KEY_SESSION_STORAGE) || '');
            } catch {
                return '';
            }
        }

        function resolveDisplayedConfigKey(rawValue) {
            const rawKey = String(rawValue ?? '').trim();
            const numericKey = sanitizeNumericConfigKey(rawKey);
            if (numericKey) return numericKey;

            const rememberedKey = getRememberedConfigKey();
            if (rememberedKey && (!rawKey || looksLikeSha1(rawKey))) {
                return rememberedKey;
            }

            return '';
        }

        function isValidConfig(cfg){
            if(!cfg || typeof cfg !== 'object') return false;
            // if(cfg.version !== 1) return false;
            const required = [
                'meter_baudrate', 'meter_configuration', 'apn', 'operator', 'tcp_port'
            ];
            return required.every((k) => k in cfg);
        }


        function collectFormConfig(formEl){
            const out = {};
            const controls = formEl.querySelectorAll('input, select, textarea');
            
            controls.forEach((el) =>{
                const forceNumber = el.dataset.type === "number";

                if(!el.name || el.type === 'file') return;
                if((el.type === 'checkbox' || el.type === 'radio')) {
                    out[el.name] = el.checked ? (el.value || true): false;
                    return;
                }
                if (el.name === 'key') {
                    out[el.name] = el.value === '' ? '' : String(el.value);
                    return;
                }
                out[el.name] = (el.type === 'number' || forceNumber) && el.value !== '' ? Number(el.value) : el.value;
            });

            out.exported_at = new Date().toISOString();
            out.version = 1;
            return out;
        }

        function applyConfigToForm(formEl, cfg){
            Object.entries(cfg).forEach(([key, rawValue]) =>{
                if(key === 'exported_at' || key === 'version') return;
                const field = formEl.elements.namedItem(key);
                if(!field) return;

                const value = rawValue ?? '';
                if(field.type === 'checkbox'){
                    field.checked = value === true || value === 1 || value === '1';
                }else {
                    field.value = String(value);
                }

                field.dispatchEvent(new Event('input',  { bubbles:true }));
                field.dispatchEvent(new Event('change',  { bubbles:true }));
            });
        }
